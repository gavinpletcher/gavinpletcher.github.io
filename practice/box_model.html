<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model</title>
        <script src="../validate.js"></script>
<style>
#red{
    background-color:red;
    height:100px;
    width:100px;
    border:2px black solid;
    background-clip:content-box;
    margin-left:300px;
}
#blue{
background-color:blue;
height:100px;
width:100px;
border:2px black solid;
background-clip:content-box;

}

    width:100px;
    border:2px black solid;

}
#purple{

height:100px;
width:100px;
padding-bottom:100px;

border:2px black solid;

}

        <h1>Box Model</h1>

<div id="yellow"></div>
